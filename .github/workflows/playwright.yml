name: Playwright Tests for eShopAdmin
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Require the eShop repository variable
      run: test -n "$ESHOP_REPOSITORY" || { echo "::error::Set the ESHOP_REPOSITORY repository variable (owner/name of the eShop repository)."; exit 1; }
      env:
        ESHOP_REPOSITORY: ${{ vars.ESHOP_REPOSITORY }}
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out eShop
      uses: actions/checkout@v4
      with:
        repository: ${{ vars.ESHOP_REPOSITORY }}
        # Empty ESHOP_REF means eShop's default branch (the eShop fork has no `main`).
        ref: ${{ vars.ESHOP_REF }}
        path: eshop
        persist-credentials: false
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Start eShop
      # eShop's AppHost runs in the background for the rest of the job. Its dashboard uses
      # ports 19888/18848/18076/19076, eShopAdmin's AppHost 19890/18850/18078/19078, so they don't collide.
      run: |
        nohup dotnet run --project eshop/src/eShop.AppHost > "$RUNNER_TEMP/eshop-apphost.log" 2>&1 &
        echo $! > "$RUNNER_TEMP/eshop-apphost.pid"
      env:
        ESHOP_USE_HTTP_ENDPOINTS: 1
        Parameters__eshopadmin-url: http://localhost:5250
    - name: Wait for eShop
      timeout-minutes: 6
      run: |
        wait_for() {
          until curl --silent --fail --output /dev/null "$1"; do
            if ! kill -0 "$(cat "$RUNNER_TEMP/eshop-apphost.pid")" 2>/dev/null; then
              echo "The eShop AppHost process exited while waiting for $1"
              exit 1
            fi
            if [ "$SECONDS" -ge 300 ]; then
              echo "Timed out after 5 minutes waiting for $1"
              exit 1
            fi
            sleep 5
          done
          echo "$1 is up"
        }
        SECONDS=0
        wait_for http://localhost:5223/.well-known/openid-configuration
        wait_for http://localhost:5230/health
    - name: Run Playwright tests
      # Playwright starts eShopAdmin's AppHost itself (webServer in playwright.config.ts).
      run: npm run test:e2e
      env:
        ESHOP_USE_HTTP_ENDPOINTS: 1
        Parameters__identity-url: http://localhost:5223
        ADMIN_URL: http://localhost:5250
        PUBLISHER_USERNAME: alice
        EDITOR_USERNAME: bob
        PASSWORD: Pass123$
    - name: Show eShop AppHost log
      if: ${{ !cancelled() }}
      run: tail -n 200 "$RUNNER_TEMP/eshop-apphost.log" || true
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
